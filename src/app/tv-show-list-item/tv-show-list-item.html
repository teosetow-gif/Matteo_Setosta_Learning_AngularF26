<div class="show-card" (click)="toggle()">
  <h3><a [routerLink]="['/shows', item().id]">{{ item().name }}</a> </h3>
  <p>Genre:
    @for (g of item().genres; track g) {
      <span> {{ g }} </span>
    }
  </p>

  <p>Rating: {{ item().rating.average }} </p>

  @switch (item().status) {
  @case ('Running') {
  <span class="badge badge-running">Running</span>
  }
  @case ('Ended') {
  <span class="badge badge-ended">Ended</span>
  }
  @default {
  <span class="badge badge-unknown">Unknown</span>}
  }

  @if (item().summary) {
  <p class="summary">{{ item().summary }}</p>
  } @else {
    <p class="summary-empty"> No summary available.</p>
  }
  <button (click)="onRemoveClick()">Remove</button>

</div>
