<div class='list-container'>
  <h2>TV Show Tracker</h2>
<p>{{ summmary() }}</p>
  @for (show of shows(); track show.id) {
  <app-tv-show-list-item [item] = "show" (opened)="onShowOpened($event)" (remove)="onRemove($event)" />
  } @empty {
  <p> No shows to display currently.</p>
  }

  <h2>Currently Running</h2>
  @for (show of running(); track show.id) {
    <p>{{ show.name }}</p>
  } @empty {
    <p>No shows currently running.</p>
  }
</div>
