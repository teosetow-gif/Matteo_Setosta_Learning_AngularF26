@if (show(); as s) {
  <h2>{{ s.name }}</h2>
  <p>Genres:
  @for (g of s.genres; track g){
    <span> {{ g }}</span>
  }
    </p>
  <p> Status: {{ s.status }}</p>
  @if ( s.rating.average !== null){}
  <p> Rating: {{ s.rating.average | number:'1.1-1'}}</p>
}
  @if (s.summary) {
    <p>{{ s.summary }}</p>
  }

  <a [routerLink]="['/shows/edit', show()?.id]">Edit </a>
}
<a routerLink="/shows">Back to list</a>
